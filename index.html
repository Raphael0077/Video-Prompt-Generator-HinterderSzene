<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erhebende-Szenen Prompt Generator</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#17171a;
    --panel-2:#1f1f23;
    --pill:#242428;
    --pill-active:#3d5afe;
    --text:#f2f2f3;
    --text-dim:#9a9aa2;
    --border:#2a2a2f;
    --accent:#6c8cff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 20% 0%, #1a1a20 0%, var(--bg) 55%);
    color:var(--text);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .app{
    max-width:1000px;
    margin:0 auto;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    gap:12px;
  }
  header h1{
    font-size:20px;
    font-weight:600;
    margin:0;
  }
  .subtitle{
    color:var(--text-dim);
    font-size:13px;
    margin-top:4px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px;
  }
  .category{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px 16px;
  }
  .category.full{
    grid-column:1 / -1;
  }
  .category-header{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    margin-bottom:14px;
  }
  .category-header .icon{
    font-size:16px;
    opacity:.8;
  }
  .category-header .label{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  .category-desc{
    text-align:center;
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:-8px;
    margin-bottom:14px;
    line-height:1.4;
  }
  .sub-label{
    text-align:center;
    font-size:12px;
    color:var(--text);
    font-weight:600;
    margin-top:16px;
    margin-bottom:10px;
  }
  .sub-label:first-of-type{
    margin-top:4px;
  }
  .info-line{
    margin-top:12px;
    font-size:12px;
    color:var(--accent);
    text-align:center;
    line-height:1.5;
    min-height:2.6em;
  }
  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .pill{
    background:var(--pill);
    border:1px solid transparent;
    color:var(--text);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    user-select:none;
  }
  .pill:hover{
    background:var(--panel-2);
  }
  .pill.active{
    background:var(--pill-active);
    color:#fff;
  }
  .slider-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  input[type="range"]{
    width:100%;
    accent-color:var(--accent);
  }
  .slider-value{
    font-size:22px;
    font-weight:700;
  }
  .slider-value span{
    font-size:12px;
    color:var(--text-dim);
    font-weight:500;
    margin-left:2px;
  }
  input[type="text"], textarea.free-text{
    width:100%;
    resize:vertical;
    background:var(--pill);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    padding:10px 12px;
    font-family:inherit;
    font-size:13px;
  }
  input[type="text"]{
    height:40px;
    margin-bottom:10px;
  }
  textarea.free-text{
    min-height:56px;
  }
  .erg-wrap{
    margin-top:12px;
  }
  .erg-label{
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
    display:block;
  }
  .erg-label b{
    color:var(--accent);
  }
  .field-label{
    font-size:12px;
    color:var(--text);
    font-weight:600;
    margin-bottom:6px;
    display:block;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:13px;
    color:var(--text-dim);
    cursor:pointer;
    user-select:none;
    margin-bottom:12px;
  }
  .toggle-row input{
    width:18px;
    height:18px;
    accent-color:var(--accent);
  }
  .output{
    margin-top:28px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
  }
  .output-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .output-header .label{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  #promptText{
    font-size:15px;
    line-height:1.6;
    color:var(--text);
    white-space:pre-wrap;
  }
  button.copy-btn{
    background:var(--pill-active);
    border:none;
    color:#fff;
    padding:8px 16px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
  }
  button.copy-btn:active{
    transform:scale(.97);
  }
  button.copy-btn.copied{
    background:#2ecc71;
  }
  .reset-link{
    color:var(--text-dim);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    white-space:nowrap;
  }
</style>
</head>

const grid = document.getElementById("categoryGrid");

function makeCard(icon, labelText, descText, full) {
  const card = document.createElement("div");
  card.className = "category" + (full ? " full" : "");
  const header = document.createElement("div");
  header.className = "category-header";
  header.innerHTML = `<span class="icon">${icon}</span><span class="label">${labelText}</span>`;
  card.appendChild(header);
  if (descText) {
    const desc = document.createElement("div");
    desc.className = "category-desc";
    desc.textContent = descText;
    card.appendChild(desc);
  }
  return card;
}

// adds a small "eigene Ergänzung" textarea to a card, bound to state[key]
function addErgField(card, key, placeholder) {
  const wrap = document.createElement("div");
  wrap.className = "erg-wrap";
  const label = document.createElement("span");
  label.className = "erg-label";
  label.innerHTML = `<b>+</b> Eigene Ergänzung (optional)`;
  const textarea = document.createElement("textarea");
  textarea.className = "free-text";
  textarea.placeholder = placeholder || "z.B. weitere Details, die hier ergänzt werden sollen...";
  textarea.value = state[key] || "";
  textarea.addEventListener("input", () => { state[key] = textarea.value.trim(); updatePrompt(); });
  wrap.appendChild(label);
  wrap.appendChild(textarea);
  card.appendChild(wrap);
}

// accessor = { get(): value, set(v): void } — set() only needed for single-select
function renderPillGroup(card, options, accessor, multi) {
  const pills = document.createElement("div");
  pills.className = "pills";
  const infoLine = document.createElement("div");
  infoLine.className = "info-line";
  const showHint = (o) => { infoLine.textContent = (o && o.hint) || ""; };

  const isActive = (o) => {
    const val = accessor.get();
    return multi ? val.includes(o.text || o.id) : val === o.id;
  };
  const refreshActive = () => {
    Array.from(pills.children).forEach((p, i) => p.classList.toggle("active", isActive(options[i])));
  };

  options.forEach(o => {
    const pill = document.createElement("button");
    pill.type = "button";
    pill.className = "pill" + (isActive(o) ? " active" : "");
    pill.textContent = (o.icon ? o.icon + " " : "") + o.label;
    pill.addEventListener("click", () => {
      if (multi) {
        const arr = accessor.get();
        const val = o.text;
        const idx = arr.indexOf(val);
        if (idx === -1) arr.push(val); else arr.splice(idx, 1);
      } else {
        accessor.set(accessor.get() === o.id ? null : o.id);
      }
      refreshActive();
      showHint(o);
      updatePrompt();
    });
    pill.addEventListener("mouseenter", () => showHint(o));
    pill.addEventListener("mouseleave", () => {
      if (!multi) {
        const val = accessor.get();
        showHint(options.find(x => x.id === val));
      } else {
        infoLine.textContent = "";
      }
    });
    pills.appendChild(pill);
  });
  card.appendChild(pills);
  card.appendChild(infoLine);
}

  durLabel.className = "field-label";
  durLabel.textContent = "Dauer dieser Szene (Sekunden, optional)";
  const durInput = document.createElement("input");
  durInput.type = "text";
  durInput.inputMode = "numeric";
  durInput.placeholder = "z.B. 3";
  durInput.style.marginBottom = "0";
  durInput.value = state.scenes[i].dauer;
  durInput.addEventListener("input", () => {
    state.scenes[i].dauer = durInput.value.replace(/[^0-9]/g, "");
    if (durInput.value !== state.scenes[i].dauer) durInput.value = state.scenes[i].dauer;
    updatePrompt();
  });
  durWrap.appendChild(durLabel);
  durWrap.appendChild(durInput);
  card.appendChild(durWrap);

  grid.appendChild(card);
});

{

{

{

function updatePrompt() {
  const parts = [];

  // Referenzbild 1 – Hauptfigur
  if (state.figureShort) {
    let line = `Verwende das hochgeladene Bild (Referenzbild 1 – Hauptfigur) als exaktes Hauptmotiv des Videos: ${state.figureShort}. Aussehen, Gesicht, Kleidung und Proportionen dürfen nicht verändert oder neu interpretiert werden — sie müssen exakt wie im Referenzbild beibehalten werden.`;
    if (state.figureErg) line += " " + state.figureErg;
    parts.push("REFERENZBILD 1 – HAUPTFIGUR\n" + line);
  }

  // Referenzbild 2 – Hintergrund/Ort
  if (state.placeShort) {
    let line = `Verwende das hochgeladene Bild (Referenzbild 2 – Hintergrund/Ort) als exakten Schauplatz: ${state.placeShort}. Umgebung, Architektur, Licht und Perspektive müssen exakt wie im Referenzbild beibehalten werden.`;
    if (state.placeErg) line += " " + state.placeErg;
    parts.push("REFERENZBILD 2 – HINTERGRUND / ORT\n" + line);
  }

  // Grundstimmung
  {
    const lines = [];
    if (state.theme) {
      const t = THEMES.find(x => x.id === state.theme);
      lines.push(`Emotionaler Kern: ${t.label} – ${t.hint}`);
    }
    if (state.themeErg) lines.push(state.themeErg);
    if (state.light) {
      const l = LIGHT.find(x => x.id === state.light);
      lines.push(`Licht & Tageszeit: ${l.label} – ${l.hint}`);
    }
    if (state.lightErg) lines.push(state.lightErg);
    if (lines.length) parts.push("GRUNDSTIMMUNG\n" + lines.join("\n"));
  }

  // Szenen
  {
    const activeBlocks = [];
    state.scenes.forEach((sc, i) => {
      const lines = [];
      if (sc.dauer) lines.push(`Dauer: ${sc.dauer} Sekunden.`);
      if (sc.camera) {
        const c = CAMERA.find(x => x.id === sc.camera);
        lines.push(`Kamera: ${c.phrase}.`);
      }
      if (sc.text) lines.push(`Was passiert: ${sc.text}`);
      if (lines.length) activeBlocks.push(SCENE_LABELS[i].toUpperCase() + "\n" + lines.join("\n"));
    });

    if (activeBlocks.length) {
      const transition = state.transition ? TRANSITIONS.find(x => x.id === state.transition) : null;
      activeBlocks.forEach((block, i) => {
        parts.push(block);
        if (i < activeBlocks.length - 1 && transition) {
          parts.push("SZENENÜBERGANG\n" + `Übergang zur nächsten Szene mit ${transition.phrase}.`);
        }
      });
      if (state.sceneErg) {
        parts.push("HINWEIS ZU DEN SZENEN\n" + state.sceneErg);
      }
    }
  }

  // Musik & Atmosphäre
  if (state.audio || state.audioErg) {
    const lines = [];
    if (state.audio) {
      const a = AUDIO.find(x => x.id === state.audio);
      lines.push(`${a.label} – ${a.hint}`);
    }
    if (state.audioErg) lines.push(state.audioErg);
    parts.push("MUSIK & ATMOSPHÄRE\n" + lines.join("\n"));
  }

  // Schlussteil: Studio-Enthüllung
  if (state.revealOn) {
    const reveal = state.revealType ? REVEAL_TYPES.find(x => x.id === state.revealType) : null;
    const revealPhrase = reveal ? reveal.phrase : "einem professionellen Filmstudio";
    let line = `Im Moment des emotionalen Höhepunkts beginnt die Kamera eine sanfte, durchgehende Rückwärtsfahrt und hebt sich gleichzeitig nach oben. Während die Kamera zurückweicht, wird die Illusion aufgelöst: Die gesamte Szene wurde in Wirklichkeit in ${revealPhrase} gefilmt. Es soll wie ein echter, hochwertiger Blick hinter die Kulissen einer professionellen Produktion wirken — erst wenn die Kamera vollständig zurückfährt, wird klar, dass es sich um ein Filmset handelt.`;
    if (state.revealErg) line += " " + state.revealErg;
    parts.push("SCHLUSSTEIL: STUDIO-ENTHÜLLUNG\n" + line);
  }

  // Titel-Einblendung
  if (state.titleOn && (state.title1 || state.title2)) {
    const lines = [state.revealOn
      ? "Sobald die Kamera ihre weiteste Einstellung erreicht, blendet elegante, filmische Typografie langsam ein."
      : "Sobald sich die Szene beruhigt, blendet elegante, filmische Typografie langsam ein."];
    if (state.title1) lines.push(`Erste Zeile:\n${state.title1}`);
    if (state.title2) lines.push(`Eine Sekunde später:\n${state.title2}`);
    parts.push("TITEL-EINBLENDUNG\n" + lines.join("\n"));
  }

  // Stil-Tags
  if (state.styleTags.length || state.styleErg) {
    const tags = state.styleTags.slice();
    if (state.styleErg) {
      state.styleErg.split(",").map(s => s.trim()).filter(Boolean).forEach(t => tags.push(t));
    }
    parts.push("STIL\n" + tags.map(t => t + ".").join("\n"));
  }

  // Format
  {
    const lines = [`Gesamtlänge: ${state.dauerGesamt} Sekunden.`];
    if (state.aspect) lines.push(`Seitenverhältnis: ${state.aspect}.`);
    if (state.durationErg) lines.push(state.durationErg);
    parts.push("FORMAT\n" + lines.join("\n"));
  }

  document.getElementById("promptText").textContent = parts.length
    ? parts.join("\n\n")
    : "Wähle mindestens einen Punkt aus, um einen Prompt zu erzeugen...";
}

// Fallback via ein unsichtbares Textarea + execCommand — nötig weil
// navigator.clipboard.writeText auf file:// Seiten in manchen Chrome-Versionen
// weder resolved noch rejected (die Berechtigungsabfrage hängt lautlos).
function copyViaExecCommand(text) {
  return new Promise((resolve) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    resolve(ok);
  });
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    const viaApi = navigator.clipboard.writeText(text).then(() => true).catch(() => false);
    const timeout = new Promise((resolve) => setTimeout(() => resolve(false), 600));
    return Promise.race([viaApi, timeout]).then(ok => ok ? true : copyViaExecCommand(text));
  }
  return copyViaExecCommand(text);
}

document.getElementById("copyBtn").addEventListener("click", () => {
  const text = document.getElementById("promptText").textContent;
  const btn = document.getElementById("copyBtn");
  copyToClipboard(text).then((ok) => {
    btn.textContent = ok ? "Kopiert!" : "Fehler beim Kopieren";
    btn.classList.toggle("copied", !!ok);
    setTimeout(() => { btn.textContent = "Kopieren"; btn.classList.remove("copied"); }, 1500);
  });
});

document.getElementById("resetBtn").addEventListener("click", () => {
  location.reload();
});

updatePrompt();
</script>
