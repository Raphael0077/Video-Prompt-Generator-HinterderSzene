<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erhebende-Szenen Prompt Generator</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#17171a;
    --panel-2:#1f1f23;
    --pill:#242428;
    --pill-active:#3d5afe;
    --text:#f2f2f3;
    --text-dim:#9a9aa2;
    --border:#2a2a2f;
    --accent:#6c8cff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 20% 0%, #1a1a20 0%, var(--bg) 55%);
    color:var(--text);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .app{
    max-width:1000px;
    margin:0 auto;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    gap:12px;
  }
  header h1{
    font-size:20px;
    font-weight:600;
    margin:0;
  }
  .subtitle{
    color:var(--text-dim);
    font-size:13px;
    margin-top:4px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px;
  }
  .category{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px 16px;
  }
  .category.full{
    grid-column:1 / -1;
  }
  .category-header{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    margin-bottom:14px;
  }
  .category-header .icon{
    font-size:16px;
    opacity:.8;
  }
  .category-header .label{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  .category-desc{
    text-align:center;
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:-8px;
    margin-bottom:14px;
    line-height:1.4;
  }
  .info-line{
    margin-top:12px;
    font-size:12px;
    color:var(--accent);
    text-align:center;
    line-height:1.5;
    min-height:2.6em;
  }
  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .pill{
    background:var(--pill);
    border:1px solid transparent;
    color:var(--text);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    user-select:none;
  }
  .pill:hover{
    background:var(--panel-2);
  }
  .pill.active{
    background:var(--pill-active);
    color:#fff;
  }
  .slider-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  input[type="range"]{
    width:100%;
    accent-color:var(--accent);
  }
  .slider-value{
    font-size:22px;
    font-weight:700;
  }
  .slider-value span{
    font-size:12px;
    color:var(--text-dim);
    font-weight:500;
    margin-left:2px;
  }
  input[type="text"], textarea.free-text{
    width:100%;
    resize:vertical;
    background:var(--pill);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    padding:10px 12px;
    font-family:inherit;
    font-size:13px;
  }
  input[type="text"]{
    height:40px;
    margin-bottom:10px;
  }
  textarea.free-text{
    min-height:56px;
  }
  .erg-wrap{
    margin-top:12px;
  }
  .erg-label{
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
    display:block;
  }
  .erg-label b{
    color:var(--accent);
  }
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:13px;
    color:var(--text-dim);
    cursor:pointer;
    user-select:none;
    margin-bottom:12px;
  }
  .toggle-row input{
    width:18px;
    height:18px;
    accent-color:var(--accent);
  }
  .output{
    margin-top:28px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
  }
  .output-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .output-header .label{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  #promptText{
    font-size:15px;
    line-height:1.6;
    color:var(--text);
    white-space:pre-wrap;
  }
  button.copy-btn{
    background:var(--pill-active);
    border:none;
    color:#fff;
    padding:8px 16px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
  }
  button.copy-btn:active{
    transform:scale(.97);
  }
  button.copy-btn.copied{
    background:#2ecc71;
  }
  .reset-link{
    color:var(--text-dim);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    white-space:nowrap;
  }
</style>
</head>

const grid = document.getElementById("categoryGrid");

function makeCard(icon, labelText, descText, full) {
  const card = document.createElement("div");
  card.className = "category" + (full ? " full" : "");
  const header = document.createElement("div");
  header.className = "category-header";
  header.innerHTML = `<span class="icon">${icon}</span><span class="label">${labelText}</span>`;
  card.appendChild(header);
  if (descText) {
    const desc = document.createElement("div");
    desc.className = "category-desc";
    desc.textContent = descText;
    card.appendChild(desc);
  }
  return card;
}

// adds a small "eigene Ergänzung" textarea to a card, bound to state[key]
function addErgField(card, key, placeholder) {
  const wrap = document.createElement("div");
  wrap.className = "erg-wrap";
  const label = document.createElement("span");
  label.className = "erg-label";
  label.innerHTML = `<b>+</b> Eigene Ergänzung (optional)`;
  const textarea = document.createElement("textarea");
  textarea.className = "free-text";
  textarea.placeholder = placeholder || "z.B. weitere Details, die hier ergänzt werden sollen...";
  textarea.value = state[key] || "";
  textarea.addEventListener("input", () => { state[key] = textarea.value.trim(); updatePrompt(); });
  wrap.appendChild(label);
  wrap.appendChild(textarea);
  card.appendChild(wrap);
}

function renderPillGroup(card, options, stateKey, multi, onChange) {
  const pills = document.createElement("div");
  pills.className = "pills";
  const infoLine = document.createElement("div");
  infoLine.className = "info-line";
  const showHint = (o) => { infoLine.textContent = (o && o.hint) || ""; };

  const isActive = (o) => multi ? state[stateKey].includes(o.text || o.id) : state[stateKey] === o.id;

  options.forEach(o => {
    const pill = document.createElement("button");
    pill.className = "pill" + (isActive(o) ? " active" : "");
    pill.textContent = (o.icon ? o.icon + " " : "") + o.label;
    pill.addEventListener("click", () => {
      if (multi) {
        const val = o.text;
        const idx = state[stateKey].indexOf(val);
        if (idx === -1) { state[stateKey].push(val); pill.classList.add("active"); }
        else { state[stateKey].splice(idx, 1); pill.classList.remove("active"); }
      } else {
        state[stateKey] = o.id;
        pills.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
      }
      showHint(o);
      if (onChange) onChange();
      updatePrompt();
    });
    pill.addEventListener("mouseenter", () => showHint(o));
    pill.addEventListener("mouseleave", () => {
      if (!multi) showHint(options.find(x => x.id === state[stateKey]));
      else infoLine.textContent = "";
    });
    pills.appendChild(pill);
  });
  card.appendChild(pills);
  if (!multi) showHint(options.find(x => x.id === state[stateKey]));
  card.appendChild(infoLine);
}

{

// --- Schlussteil: Studio-Enthüllung ---
{
  const card = makeCard("🎦", "Schlussteil: Studio-Enthüllung (optional)", "Am Ende zieht die Kamera zurück und enthüllt, dass die ganze Szene in einem Studio gefilmt wurde.");

  const toggleRow = document.createElement("label");
  toggleRow.className = "toggle-row";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = state.revealOn;

  const pillsWrap = document.createElement("div");
  pillsWrap.style.display = state.revealOn ? "block" : "none";
  renderPillGroup(pillsWrap, REVEAL_TYPES, "revealType", false);
  addErgField(pillsWrap, "revealErg", "z.B. weitere Details zur Enthüllung (Crew, Equipment, Stimmung)...");

  cb.addEventListener("change", () => {
    state.revealOn = cb.checked;
    pillsWrap.style.display = state.revealOn ? "block" : "none";
    updatePrompt();
  });
  toggleRow.appendChild(cb);
  toggleRow.appendChild(document.createTextNode("Studio-Enthüllung am Ende verwenden"));
  card.appendChild(toggleRow);
  card.appendChild(pillsWrap);

// --- Titel-Einblendung ---
{
  const card = makeCard("🔤", "Titel-Einblendung (optional)", "Freie Textzeilen, die am Ende der Szene eingeblendet werden.");
  card.classList.add("full");
  const toggleRow = document.createElement("label");
  toggleRow.className = "toggle-row";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = state.titleOn;
  const t1 = document.createElement("input");
  const t2 = document.createElement("input");
  cb.addEventListener("change", () => {
    state.titleOn = cb.checked;
    t1.style.display = state.titleOn ? "block" : "none";
    t2.style.display = state.titleOn ? "block" : "none";
    updatePrompt();
  });
  toggleRow.appendChild(cb);
  toggleRow.appendChild(document.createTextNode("Titel-Einblendung verwenden"));
  card.appendChild(toggleRow);

  t1.type = "text";
  t1.placeholder = "Titelzeile 1, z.B. EIN NEUER ANFANG";

  t1.addEventListener("input", () => { state.title1 = t1.value.trim(); updatePrompt(); });
  card.appendChild(t1);

  t2.type = "text";
  t2.placeholder = "Titelzeile 2, z.B. DEINE GESCHICHTE BEGINNT JETZT";
  t2.style.display = state.titleOn ? "block" : "none";
  t2.addEventListener("input", () => { state.title2 = t2.value.trim(); updatePrompt(); });

// --- Dauer & Format ---
{
  const card = makeCard("📐", "Dauer & Format", "Videolänge in Sekunden und Seitenverhältnis.");
  const row = document.createElement("div");
  row.className = "slider-row";
  const valueDisplay = document.createElement("div");
  valueDisplay.className = "slider-value";
  valueDisplay.innerHTML = `${state.dauer}<span>Sek.</span>`;
  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = 6; slider.max = 20; slider.step = 1; slider.value = state.dauer;
  slider.addEventListener("input", () => {
    state.dauer = Number(slider.value);
    valueDisplay.innerHTML = `${state.dauer}<span>Sek.</span>`;
    updatePrompt();
  });
  row.appendChild(valueDisplay);
  row.appendChild(slider);
  card.appendChild(row);

  const pills = document.createElement("div");
  pills.className = "pills";
  pills.style.marginTop = "12px";
  ASPECTS.forEach(a => {
    const pill = document.createElement("button");
    pill.className = "pill" + (a === state.aspect ? " active" : "");
    pill.textContent = a;
    pill.addEventListener("click", () => {
      state.aspect = a;
      pills.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      updatePrompt();
    });
    pills.appendChild(pill);
  });
  card.appendChild(pills);
  addErgField(card, "durationErg", "z.B. Wünsche zu Framerate, Auflösung...");
  grid.appendChild(card);
}

function fillSubject(text, subj) {
  return text.split("{SUBJECT}").join(subj);
}

function capFirst(str) {
  return str.replace(/(^\s*|[.!?:]\s+)([a-z])/g, (m, pre, c) => pre + c.toUpperCase());
}

function currentTheme() { return THEMES.find(t => t.id === state.theme) || THEMES[0]; }
function currentLight() { return LIGHT.find(l => l.id === state.light) || LIGHT[0]; }
function currentAudio() { return AUDIO.find(a => a.id === state.audio) || AUDIO[0]; }
function currentTransition() { return TRANSITIONS.find(t => t.id === state.transition) || TRANSITIONS[0]; }
function currentReveal() { return REVEAL_TYPES.find(r => r.id === state.revealType) || REVEAL_TYPES[0]; }
function cameraById(id) { return CAMERA.find(c => c.id === id) || CAMERA[0]; }

function updatePrompt() {
  const figure = state.figureShort || "the main character";
  const place = state.placeShort || "the setting";
  const theme = currentTheme();
  const light = currentLight();
  const audio = currentAudio();
  const transition = currentTransition();
  const cam1 = cameraById(state.camera1);
  const cam2 = cameraById(state.camera2);
  const cam3 = cameraById(state.camera3);

  const parts = [];

  parts.push(capFirst(`Use the uploaded character reference image as the exact main subject of the video: ${figure}. Do NOT redesign, replace, or reinterpret their appearance, face, clothing, or proportions — preserve them exactly as shown in the reference image throughout the video.${state.figureErg ? " " + state.figureErg : ""}`));

  parts.push(capFirst(`Use the uploaded background reference image as the exact setting: ${place}. Preserve the environment, architecture, lighting, and perspective exactly as shown in the reference image.${state.placeErg ? " " + state.placeErg : ""}`));

  // Szene 1: Etablierung
  parts.push(capFirst(`Scene 1 (establishing shot): The video begins with a calm, cinematic shot of ${figure} in ${place} under ${light.phrase} skies. The mood is quiet and contemplative for the first ${state.aufbau} seconds. Camera: ${cam1.phrase}.${state.lightErg ? " " + state.lightErg : ""}`));

  parts.push(capFirst(`The scene transitions to the next moment with ${transition.phrase}.`));

  // Szene 2: Aufbau
  const buildupText = fillSubject(theme.buildup, figure);
  parts.push(capFirst(`Scene 2 (build-up): ${buildupText} Camera: ${cam2.phrase}.`));

  parts.push(capFirst(`The scene transitions to the next moment with ${transition.phrase}.`));

  // Szene 3: Höhepunkt
  const climaxText = fillSubject(theme.climax, figure);
  parts.push(capFirst(`Scene 3 (emotional climax): ${climaxText} Camera: ${cam3.phrase}.${state.themeErg ? " " + state.themeErg : ""}${state.sceneErg ? " " + state.sceneErg : ""}`));

  parts.push(capFirst(`The audio atmosphere builds with ${audio.phrase}.${state.audioErg ? " " + state.audioErg : ""}`));

  if (state.revealOn) {
    const reveal = currentReveal();
    parts.push(capFirst(`At the exact moment the emotional climax is reached, the camera begins a smooth, continuous pull-back while craning upward. As the camera retreats, the illusion is revealed: the entire scene has actually been filmed inside ${reveal.phrase}. It should feel like a genuine, high-end behind-the-scenes glimpse of a professional production — the audience only realizes it is a film set once the camera fully reveals it.${state.revealErg ? " " + state.revealErg : ""}`));
  }

  if (state.titleOn && (state.title1 || state.title2)) {
    let titleBlock = state.revealOn
      ? "As the camera reaches its widest view, elegant cinematic typography slowly fades in."
      : "As the scene settles, elegant cinematic typography slowly fades in.";
    if (state.title1) titleBlock += `\nFirst line:\n${state.title1}`;
    if (state.title2) titleBlock += `\nOne second later:\n${state.title2}`;
    parts.push(titleBlock);
  }

  if (state.styleTags.length || state.styleErg) {
    let tags = state.styleTags.slice();
    if (state.styleErg) {
      state.styleErg.split(",").map(s => s.trim()).filter(Boolean).forEach(t => tags.push(t));
    }
    parts.push(tags.join(".\n") + ".");
  }

  parts.push(capFirst(`Duration: ${state.dauer} seconds.\nAspect Ratio: ${state.aspect}.${state.durationErg ? " " + state.durationErg : ""}`));

  document.getElementById("promptText").textContent = parts.join("\n\n");
}

// Fallback via ein unsichtbares Textarea + execCommand — nötig weil
// navigator.clipboard.writeText auf file:// Seiten in manchen Chrome-Versionen
// weder resolved noch rejected (die Berechtigungsabfrage hängt lautlos).
function copyViaExecCommand(text) {
  return new Promise((resolve) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    resolve(ok);
  });
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    const viaApi = navigator.clipboard.writeText(text).then(() => true).catch(() => false);
    const timeout = new Promise((resolve) => setTimeout(() => resolve(false), 600));
    return Promise.race([viaApi, timeout]).then(ok => ok ? true : copyViaExecCommand(text));
  }
  return copyViaExecCommand(text);
}

document.getElementById("copyBtn").addEventListener("click", () => {
  const text = document.getElementById("promptText").textContent;
  const btn = document.getElementById("copyBtn");
  copyToClipboard(text).then((ok) => {
    btn.textContent = ok ? "Kopiert!" : "Fehler beim Kopieren";
    btn.classList.toggle("copied", !!ok);
    setTimeout(() => { btn.textContent = "Kopieren"; btn.classList.remove("copied"); }, 1500);
  });
});

document.getElementById("resetBtn").addEventListener("click", () => {
  location.reload();
});

updatePrompt();
</script>
